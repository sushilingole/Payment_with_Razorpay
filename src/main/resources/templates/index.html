<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RezorpayApp(Project)</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
	<div class="container py-5">
		<div class="card shadow-lg p-4 rounded-4">
			<h2 class="mb-4 text-primary">Spring Boot Payment with Razorpay</h2>

			<table class="table-borderless w-100">
				<tr>
					<td class="pb-3">
						<label for="name" class="form-label">Enter Name:</label>
						<input type="text" name="name" id="name" class="form-control" required />
					</td>
				</tr>

				<tr>
					<td class="pb-3">
						<label for="email" class="form-label">Enter Email:</label>
						<input type="email" name="email" id="email" class="form-control" required />
					</td>
				</tr>

				<tr>
					<td class="pb-3">
						<label for="phono" class="form-label">Phone Number:</label>
						<input type="number" name="phono" id="phono" class="form-control" required />
					</td>
				</tr>

				<tr>
					<td class="pb-3">
						<label for="cource" class="form-label">Select Course:</label>
						<select class="form-select" name="cource" id="cource" required>
							<option value="Cource Not Selected">- Select Course -</option>
							<option value="Java">Java</option>
							<option value="Python">Python</option>
							<option value="Dev-Ops">Dev-Ops</option>
							<option value="C">C-language</option>
						</select>
					</td>
				</tr>

				<tr>
					<td class="pb-4">
						<label for="amount" class="form-label">Amount (INR):</label>
						<input type="number" name="amount" id="amount" class="form-control" />
					</td>
				</tr>

				<tr>
					<td>
						<button id="rzp_but1" class="btn btn-primary w-100">Proceed to Pay</button>
					</td>
				</tr>
			</table>
		</div>
	</div>

	<!-- Razorpay SDK -->
	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

	<!-- Original JS logic untouched -->
	<script>
		async function createOrder() {
			console.log("---Order Creation Started---");

			const response = await fetch('http://localhost:8056/create-order', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/JSON'
				},
				body: JSON.stringify({
					name: document.getElementById('name').value,
					email: document.getElementById('email').value,
					phono: document.getElementById('phono').value,
					cource: document.getElementById('cource').value,
					amount: document.getElementById('amount').value,
					currency: 'INR'
				})
			});

			const order = await response.json();
			console.log("---Order Caption Completed---");
			return order;
		}

		document.getElementById('rzp_but1').onclick = async function (e) {
			const order = await createOrder();
			console.log(order);

			var options = {
				"key": "rzp_test_04E7bzrbQssOEp",
				"amount": document.getElementById('amount').value * 100,
				"currency": "INR",
				"name ": "Sushil Ingole",
				"description": "course Payment",
				"order_id": order.razorpayrOrder_id,
				"reciept": order.email,
				"prefill": {
					"name": document.getElementById('name').value,
					"email": document.getElementById('email').value,
					"contact": document.getElementById('phono').value
				},
				"theme": {
					"color": "#3399cc"
				}
			};

			var rzp_but1 = new Razorpay(options);
			rzp_but1.open();
			e.preventDefault();
		}
	</script>
</body>

</html>
