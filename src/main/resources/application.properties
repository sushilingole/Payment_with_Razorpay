spring.application.name= RazorPay_Application

##Datasource Proprties :
spring.datasource.url=${DB_URL} 
spring.datasource.username =${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=${DB_DRIVER_C}

spring.jpa.show-sql=${SHOW_SQL} 
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
 

##Application Port :

server.port=${PORT}

######
##Adding the Razopay Key and Secret key :

razorpay.key.id=${RP_KEY}
razorpay.secret.key =${RP_SKEY}

